name: Aggiorna previsioni

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Metti in ordine i file del progetto
        run: |
          mkdir -p pipeline docs/data
          for f in download.py model.py train.py live.py; do [ -f "$f" ] && mv "$f" pipeline/; done
          [ -f index.html ] && mv index.html docs/
          [ -f .nojekyll ] && mv .nojekyll docs/
          for f in ratings_atp.json ratings_wta.json live.json meta.json; do [ -f "$f" ] && mv "$f" docs/data/; done
          ls pipeline docs docs/data
          if [ ! -f pipeline/download.py ] || [ ! -f docs/index.html ]; then echo "::error::Mancano dei file del progetto"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -q pandas numpy

      - name: Recupera dati e stato dell'ultimo giro
        uses: actions/cache@v4
        with:
          path: |
            cache
            state
            docs/data
          key: dati-${{ github.run_id }}
          restore-keys: dati-

      - name: Scarica dati TML
        timeout-minutes: 10
        run: |
          if [ ! -f cache/2015.csv ] || [ "$(date -u +%H%M)" -lt "0415" -a "$(date -u +%H)" = "04" ]; then
            python -u pipeline/download.py --mode full
          else
            python -u pipeline/download.py --mode live
          fi

      - name: Ricalcola i modelli se ci sono risultati nuovi
        timeout-minutes: 15
        continue-on-error: true
        run: |
          mkdir -p state
          NEW=$(find cache -name '*.csv' -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-40)
          OLD=$(cat state/data_hash.txt 2>/dev/null || true)
          if [ "$NEW" != "$OLD" ] || [ ! -f docs/data/ratings_atp.json ]; then
            timeout --signal=INT 720 python -X faulthandler -u pipeline/train.py --cache cache --out docs/data && echo "$NEW" > state/data_hash.txt
          else
            echo "Nessun risultato nuovo: modelli invariati."
          fi

      - name: Quote e allarmi dal vivo
        timeout-minutes: 5
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -u pipeline/live.py --cache cache --out docs/data --state state

      - name: Promemoria mensile
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0103" ] && [ "$(date -u +%M)" -lt "15" ]; then
            date -u > state_keepalive.txt
            git config user.name "aggiornamento-automatico"; git config user.email "actions@users.noreply.github.com"
            git add state_keepalive.txt && git commit -m "promemoria mensile" && git push || true
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
